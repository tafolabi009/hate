[package]
name = "hate"
version = "0.1.0"
edition = "2021"
authors = ["Hate Language Team"]
description = "A blazingly fast programming language"
license = "MIT"
repository = "https://github.com/tafolabi009/hate"
keywords = ["language", "interpreter", "vm", "compiler"]
categories = ["development-tools", "compilers"]

[lib]
name = "hate"
path = "src/lib.rs"

[[bin]]
name = "hate"
path = "src/main.rs"

[dependencies]
# CLI and REPL
rustyline = "14"
clap = { version = "4", features = ["derive"] }

# Performance
ahash = "0.8"
bumpalo = "3"
parking_lot = "0.12"
crossbeam-channel = "0.5"

# Utilities
thiserror = "2"
miette = { version = "7", features = ["fancy"] }
once_cell = "1"
memmap2 = "0.9"
num-traits = "0.2"

# Async runtime (for async/await)
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "fs", "net"] }

# Serialization (for bytecode)
bincode = "1"
serde = { version = "1", features = ["derive"] }

# For LSP
tower-lsp = { version = "0.20", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"
test-case = "3"

[features]
default = []
lsp = ["tower-lsp"]
jit = []

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
opt-level = 3
lto = "thin"

[[bench]]
name = "vm_bench"
harness = false

[[bench]]
name = "parser_bench"
harness = false
