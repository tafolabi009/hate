<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hate Language - Browser Demo</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: #1a1a2e;
            color: #eee;
        }
        h1 { color: #ff6b6b; margin-bottom: 10px; }
        .subtitle { color: #888; margin-bottom: 30px; }
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .panel {
            background: #16213e;
            border-radius: 8px;
            padding: 15px;
        }
        .panel h2 {
            margin: 0 0 15px;
            color: #4ecdc4;
            font-size: 1.1rem;
        }
        textarea {
            width: 100%;
            height: 300px;
            background: #0f0f23;
            color: #ccccff;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 10px;
            font-family: 'Fira Code', 'JetBrains Mono', monospace;
            font-size: 14px;
            resize: vertical;
        }
        textarea:focus { outline: none; border-color: #4ecdc4; }
        button {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { background: #ee5a5a; }
        button:disabled { background: #555; cursor: not-allowed; }
        #output {
            background: #0f0f23;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 10px;
            min-height: 300px;
            font-family: 'Fira Code', 'JetBrains Mono', monospace;
            font-size: 14px;
            white-space: pre-wrap;
            overflow: auto;
        }
        .status {
            padding: 8px 12px;
            border-radius: 4px;
            margin-bottom: 15px;
            font-size: 0.9rem;
        }
        .status.loading { background: #3d3d00; color: #ffff88; }
        .status.ready { background: #003300; color: #88ff88; }
        .status.error { background: #330000; color: #ff8888; }
        .examples { margin-top: 20px; }
        .examples button {
            background: #16213e;
            border: 1px solid #333;
            margin: 5px 5px 5px 0;
            font-size: 12px;
            padding: 6px 12px;
        }
        .examples button:hover { background: #1f2f4f; border-color: #4ecdc4; }
        canvas {
            background: white;
            border-radius: 4px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h1>🔥 Hate Language</h1>
    <p class="subtitle">Running in your browser via WebAssembly</p>
    
    <div id="status" class="status loading">Loading WASM module...</div>
    
    <div class="container">
        <div class="panel">
            <h2>📝 Code Editor</h2>
            <textarea id="code" spellcheck="false">// Welcome to Hate!
// Try running some code:

fn greet(name) {
    print("Hello, " + name + "!")
}

greet("World")

// Variables and math
let x = 42
let y = x * 2 + 10
print("y = " + y)

// Pattern matching
match y {
    94 => print("Got 94!"),
    _ => print("Something else")
}

// List operations
let nums = [1, 2, 3, 4, 5]
let doubled = nums.map(|n| n * 2)
print(doubled)</textarea>
            <button id="runBtn" disabled>▶ Run</button>
            <button id="clearBtn">Clear Output</button>
            
            <div class="examples">
                <strong>Examples:</strong><br>
                <button onclick="loadExample('fibonacci')">Fibonacci</button>
                <button onclick="loadExample('factorial')">Factorial</button>
                <button onclick="loadExample('classes')">Classes</button>
                <button onclick="loadExample('async')">Async</button>
                <button onclick="loadExample('canvas')">Canvas</button>
            </div>
        </div>
        
        <div class="panel">
            <h2>📤 Output</h2>
            <div id="output"></div>
            <canvas id="canvas" width="400" height="200" style="display: none;"></canvas>
        </div>
    </div>

    <script type="module">
        import Hate from './hate.js';
        
        const codeEl = document.getElementById('code');
        const outputEl = document.getElementById('output');
        const runBtn = document.getElementById('runBtn');
        const clearBtn = document.getElementById('clearBtn');
        const statusEl = document.getElementById('status');
        const canvasEl = document.getElementById('canvas');
        
        // Capture console.log for output
        const origLog = console.log;
        const output = [];
        console.log = (...args) => {
            output.push(args.map(a => 
                typeof a === 'object' ? JSON.stringify(a, null, 2) : String(a)
            ).join(' '));
            outputEl.textContent = output.join('\n');
            origLog.apply(console, args);
        };
        
        // Initialize Hate VM
        try {
            await Hate.init('./pkg/hate_wasm_bg.wasm');
            statusEl.className = 'status ready';
            statusEl.textContent = '✓ Hate VM ready (WASM loaded)';
            runBtn.disabled = false;
        } catch (e) {
            statusEl.className = 'status error';
            statusEl.textContent = '✗ Failed to load WASM: ' + e.message;
            console.error(e);
        }
        
        // Run button
        runBtn.addEventListener('click', () => {
            output.length = 0;
            outputEl.textContent = '';
            canvasEl.style.display = 'none';
            
            try {
                const result = Hate.run(codeEl.value);
                if (result !== undefined && result !== null) {
                    console.log('→', result);
                }
            } catch (e) {
                outputEl.textContent = '❌ Error: ' + e.message;
                outputEl.style.color = '#ff8888';
            }
        });
        
        // Clear button
        clearBtn.addEventListener('click', () => {
            output.length = 0;
            outputEl.textContent = '';
            canvasEl.style.display = 'none';
        });
        
        // Example code snippets
        window.loadExample = (name) => {
            const examples = {
                fibonacci: `// Fibonacci sequence
fn fib(n) {
    match n {
        0 => 0,
        1 => 1,
        _ => fib(n - 1) + fib(n - 2)
    }
}

for i in 0..15 {
    print("fib(" + i + ") = " + fib(i))
}`,
                factorial: `// Factorial with tail recursion
fn factorial(n, acc = 1) {
    match n {
        0 => acc,
        1 => acc,
        _ => factorial(n - 1, n * acc)
    }
}

for i in 0..13 {
    print(i + "! = " + factorial(i))
}`,
                classes: `// Classes and inheritance
class Animal {
    fn new(name) {
        self.name = name
    }
    
    fn speak() {
        print(self.name + " makes a sound")
    }
}

class Dog : Animal {
    fn new(name, breed) {
        super(name)
        self.breed = breed
    }
    
    fn speak() {
        print(self.name + " barks! (breed: " + self.breed + ")")
    }
}

let dog = Dog("Buddy", "Golden Retriever")
dog.speak()`,
                async: `// Async/await example
async fn fetchData() {
    print("Fetching data...")
    await sleep(500)
    print("Data received!")
    return { status: "ok", items: [1, 2, 3] }
}

async fn main() {
    let result = await fetchData()
    print("Result: " + result)
}

main()`,
                canvas: `// Canvas drawing (requires DOM bridge)
print("Canvas drawing example")
print("Drawing shapes...")

// This would use the CanvasBridge
let colors = ["red", "green", "blue", "orange", "purple"]
for i in 0..5 {
    print("Drawing circle " + i + " in " + colors[i])
}`
            };
            
            if (examples[name]) {
                codeEl.value = examples[name];
            }
        };
        
        // Keyboard shortcut: Ctrl+Enter to run
        codeEl.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'Enter') {
                runBtn.click();
            }
        });
    </script>
</body>
</html>
